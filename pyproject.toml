[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gero-stability"
version = "0.1.0"
description = "Reproducible ONNX numerical contracts and differential benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "onnx==1.19.0", "onnxruntime==1.22.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "hypothesis==6.138.2"]

[project.scripts]
gero-stability = "gero_stability.cli:main"

[tool.setuptools.packages.find]
include = ["gero_stability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
